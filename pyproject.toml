[project]
name = "sayso"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
